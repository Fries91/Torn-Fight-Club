<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Torn Fight Club</title>
<style>
body{margin:0;background:#070707;color:#f4f4f4;font-family:Arial,Helvetica,sans-serif}
header{position:sticky;top:0;z-index:10;background:linear-gradient(90deg,#260000,#111);border-bottom:1px solid #8b0000;box-shadow:0 8px 24px #0008}
.head{max-width:1180px;margin:auto;padding:12px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.logo{font-size:22px;font-weight:900;text-shadow:0 0 12px #d00}
.status{font-size:12px;color:#aaa;text-align:right}
.tabs{max-width:1180px;margin:auto;padding:0 12px 12px;display:flex;gap:6px;flex-wrap:wrap}
button,.tab{border:1px solid #666;background:#222;color:#fff;border-radius:10px;padding:9px 11px;font-weight:900;cursor:pointer}
button:active{transform:scale(.98)}
.tab{border-radius:999px}.tab.active{background:#b40000;border-color:#ff5555}
main{max-width:1180px;margin:auto;padding:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:10px}
.wide{grid-template-columns:repeat(auto-fit,minmax(330px,1fr))}
.admin-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:10px}
.card{background:#141414;border:1px solid #333;border-radius:16px;padding:12px;box-shadow:0 12px 32px #0008}
.hero{background:linear-gradient(135deg,#2b0000,#141414);border-color:#a10000}
.private{background:linear-gradient(135deg,#111827,#0b0b0b);border-color:#60a5fa}
.belt{background:linear-gradient(135deg,#3a2600,#111);border-color:#c79a22}
.ref{background:linear-gradient(135deg,#081b2f,#111);border-color:#3aa5ff}
.team{background:linear-gradient(135deg,#10220f,#111);border-color:#22c55e}
h3{margin:0 0 8px;color:#ff4b4b}.muted{color:#aaa;font-size:12px}
.pill{display:inline-block;border:1px solid #555;background:#222;border-radius:999px;padding:4px 8px;margin:2px;font-size:12px}
.good{border-color:#22c55e;background:#052e16;color:#bbf7d0}.warn{border-color:#f59e0b;background:#332500;color:#fde68a}.live{border-color:#ef4444;background:#3b0505;color:#fecaca}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.between{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
input,select,textarea{width:100%;background:#080808;color:#fff;border:1px solid #555;border-radius:10px;padding:10px;margin:4px 0;box-sizing:border-box}
textarea{min-height:90px}.green{background:#064b20;border-color:#20c060}.red{background:#8b0000;border-color:#ff3333}.gold{background:#5c4000;border-color:#ffc107}.blue{background:#07365c;border-color:#3aa5ff}
.mini{background:#0c0c0c;border:1px solid #2a2a2a;border-radius:10px;padding:8px;margin:6px 0}
.empty{border:1px dashed #555;border-radius:12px;color:#aaa;text-align:center;padding:14px}
.vs{font-size:22px;font-weight:900;color:#ff4b4b}.rank{font-size:22px;color:#ff4b4b;font-weight:900}
.section-title{margin:14px 0 8px;color:#fff;font-size:16px;border-left:4px solid #b40000;padding-left:8px}
#toast{position:fixed;right:12px;bottom:62px;background:#111;border:1px solid #ff4b4b;border-radius:12px;padding:10px;display:none;z-index:50;max-width:90vw}
.bottom-quick{position:fixed;left:0;right:0;bottom:0;background:#111;border-top:1px solid #8b0000;display:flex;gap:6px;justify-content:center;padding:7px;z-index:40}
.bottom-quick button{font-size:12px;padding:7px 9px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.78);display:none;align-items:center;justify-content:center;z-index:80;padding:12px}
.modal .box{background:#141414;border:1px solid #8b0000;border-radius:16px;padding:12px;max-width:520px;width:100%;box-shadow:0 18px 50px #000}
.bracket-round{border-left:4px solid #b40000;padding-left:8px;margin:10px 0}
.bracket-fight{background:#0c0c0c;border:1px solid #333;border-radius:10px;padding:8px;margin:6px 0}
@media(max-width:650px){.head{display:block}.status{text-align:left;margin-top:5px}.grid,.wide,.admin-grid{grid-template-columns:1fr}main{padding:8px 8px 68px}.tab{font-size:12px;padding:7px 8px}.tabs{max-height:86px;overflow:auto}.card{padding:10px}.section-title{margin-top:10px}}
</style>
</head>
<body>
<header>
  <div class="head">
    <div class="logo">🥊🔥 THE TORN FIGHT CLUB</div>
    <div class="status" id="userStatus">Starting...</div>
  </div>
  <nav class="tabs" id="tabs"></nav>
</header>

<main id="app">
  <div class="card hero">
    <h3>Loading Fight Club...</h3>
    <p class="muted">Connecting to backend...</p>
  </div>
</main>

<div id="toast"></div>
<div class="bottom-quick"><button onclick="setTab('overview')">Home</button><button onclick="setTab('fightcard')">Fights</button><button onclick="setTab('myfighter')">Mine</button><button onclick="setTab('announcements')">Posts</button></div>
<div class="modal" id="spectateModal"><div class="box"><h3>👀 Spectate / Proof Menu</h3><div id="spectateModalBody"></div><button onclick="closeSpectateMenu()">Close</button></div></div>

<script>
const BASE = "https://torn-fight-club.onrender.com";
let TOKEN = localStorage.getItem("tfc_token") || "";
let TAB = localStorage.getItem("tfc_tab") || "overview";
let STATE = {
  ok: true, user: null, events: [], fighters: [], fights: [], ideas: [], leaderboard: [],
  my_predictions: [], tournaments: [], tournament_entries: [], belts: [], teams: [], referees: [], audit: [], ref_checklists: [], fight_proofs: [], challenges: [], alerts: []
};

const ADMINS = [3679030, 1905671];

function $(id){return document.getElementById(id);}
function esc(s){return String(s ?? "").replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function toast(msg){const t=$("toast");t.textContent=msg;t.style.display="block";setTimeout(()=>t.style.display="none",3500);}
function isAdmin(){return STATE.user && ADMINS.includes(Number(STATE.user.torn_id));}
function userLine(){return STATE.user ? `${esc(STATE.user.name)} [${STATE.user.torn_id}] • ${esc(STATE.user.role)} • ${STATE.user.prediction_points} pts` : "Not logged in";}
function setTab(t){TAB=t;localStorage.setItem("tfc_tab",t);render();}
function fights(status){return (STATE.fights||[]).filter(f=>!status||f.status===status);}
function eventOptions(){return (STATE.events||[]).map(e=>`<option value="${e.id}">${e.id} — ${esc(e.title)}</option>`).join("") || `<option value="1">Default Event</option>`;}
function fighterOptions(label="Choose fighter"){return `<option value="">${esc(label)}</option>` + (STATE.fighters||[]).map(f=>`<option value="${f.id}">${f.id} — ${esc(f.nickname||f.name)} [${f.torn_id}]</option>`).join("");}
function fightOptions(){return `<option value="">Choose fight</option>` + (STATE.fights||[]).map(f=>`<option value="${f.id}">${f.id} — ${esc(f.fighter_a_nick||f.fighter_a_name)} vs ${esc(f.fighter_b_nick||f.fighter_b_name)} — ${esc(f.status)}</option>`).join("");}
function teamOptions(){return `<option value="">Choose team</option>` + (STATE.teams||[]).map(t=>`<option value="${t.id}">${t.id} — ${esc(t.name)}</option>`).join("");}
function refOptions(){return `<option value="">Choose ref</option>` + (STATE.referees||[]).map(r=>`<option value="${r.id}">${r.id} — ${esc(r.name)}</option>`).join("");}
function eventEditOptions(){return `<option value="">Choose event</option>` + (STATE.events||[]).map(e=>`<option value="${e.id}">${e.id} — ${esc(e.title)}</option>`).join("");}
function beltOptions(){return `<option value="">Choose belt</option>` + (STATE.belts||[]).map(b=>`<option value="${b.id}">${b.id} — ${esc(b.name)}</option>`).join("");}
function tournamentOptions(){return `<option value="">Choose tournament</option>` + (STATE.tournaments||[]).map(t=>`<option value="${t.id}">${t.id} — ${esc(t.title)}</option>`).join("");}
function fighterName(id){const f=(STATE.fighters||[]).find(x=>Number(x.id)===Number(id));return f ? (f.nickname||f.name) : "Fighter "+id;}

async function api(path, method="GET", body=null){
  const controller = new AbortController();
  const timer = setTimeout(()=>controller.abort(), 15000);
  try{
    const res = await fetch(BASE + path, {
      method,
      signal: controller.signal,
      headers: {"Content-Type":"application/json", ...(TOKEN ? {"Authorization":"Bearer "+TOKEN} : {})},
      body: body ? JSON.stringify(body) : null
    });
    const text = await res.text();
    let data = {};
    try{data = JSON.parse(text || "{}");}
    catch(e){throw new Error("Backend returned bad JSON.");}
    if(!res.ok || data.ok === false) throw new Error(data.error || "Backend request failed.");
    return data;
  }finally{clearTimeout(timer);}
}

async function refresh(){
  $("userStatus").textContent = "Refreshing...";
  try{STATE = await api("/api/state"); render();}
  catch(e){
    $("userStatus").textContent = "Offline";
    $("app").innerHTML = `<div class="card hero"><h3>Connection Error</h3><p>${esc(e.message)}</p><p class="muted">Check Render and /api/state.</p><button onclick="refresh()">Retry</button></div>`;
  }
}

function renderTabs(){
  const tabs = ["overview","fightcard","fighters","myfighter","challenges","picks","leaderboard","tournaments","belts","teams","refs","announcements","ideas","rules","settings"];
  if(isAdmin()) tabs.push("admin");
  const labels = {overview:"Overview",fightcard:"Fight Card",fighters:"Fighters",myfighter:"My Fighter",challenges:"Challenges",picks:"Picks",leaderboard:"Ranks",tournaments:"Brackets",belts:"Belts",teams:"Teams",refs:"Refs",announcements:"Posts",ideas:"Ideas",rules:"Rules",settings:"Settings",admin:"Admin"};
  $("tabs").innerHTML = tabs.map(t=>`<button class="tab ${TAB===t?"active":""}" onclick="setTab('${t}')">${labels[t]}</button>`).join("");
}

function render(){
  $("userStatus").innerHTML = userLine();
  renderTabs();
  const pages = {overview, fightcard, fighters, myfighter, challenges, picks, leaderboard, tournaments, belts, teams, refs, announcements, ideas, rules, settings, admin};
  $("app").innerHTML = (pages[TAB] || overview)();
}


function checklistForFight(fightId){
  return (STATE.ref_checklists||[]).find(c=>Number(c.fight_id)===Number(fightId)) || {};
}
function checklistSummary(fightId){
  const c = checklistForFight(fightId);
  const checks = ["both_showed","rules_confirmed","fight_started","winner_confirmed","method_confirmed"];
  const done = checks.filter(k=>Number(c[k]||0)===1).length;
  const cls = done===5 ? "good" : done>0 ? "warn" : "";
  return `<span class="pill ${cls}">Ref checklist ${done}/5</span>`;
}
function checkbox(name, label, checked){
  return `<label class="mini"><input type="checkbox" id="${name}" ${checked ? "checked" : ""} style="width:auto;margin-right:6px">${label}</label>`;
}


function proofsForFight(fightId){
  return (STATE.fight_proofs||[]).filter(p=>Number(p.fight_id)===Number(fightId));
}
function proofSummary(fightId){
  const n = proofsForFight(fightId).length;
  return `<span class="pill ${n ? "good" : ""}">Proofs ${n}</span>`;
}
function proofListHtml(fightId, adminControls=false){
  const proofs = proofsForFight(fightId);
  if(!proofs.length) return `<div class="empty">No proof links or notes saved yet.</div>`;
  return proofs.map(p=>`
    <div class="mini">
      <b>${esc(p.title || p.proof_type || "Proof")}</b>
      <span class="pill">${esc(p.proof_type || "note")}</span>
      ${p.url ? `<br><button class="blue" onclick="openSpectate('${encodeURIComponent(String(p.url||""))}')">Open Link</button>` : ""}
      ${p.notes ? `<div class="muted">${esc(p.notes)}</div>` : ""}
      <div class="muted">Proof ID ${p.id} • ${esc(p.created_at||"")}</div>
      ${adminControls ? `<button class="red" onclick="deleteProof(${p.id})">Delete Proof</button>` : ""}
    </div>
  `).join("");
}

function fightCard(f, pick=false){
  const a = f.fighter_a_nick || f.fighter_a_name || "Fighter A";
  const b = f.fighter_b_nick || f.fighter_b_name || "Fighter B";
  const mine = (STATE.my_predictions||[]).find(p=>Number(p.fight_id)===Number(f.id));
  const cls = f.status==="live" ? "live" : f.status==="done" ? "good" : "warn";
  return `
    <div class="card">
      <div class="between"><h3>${esc(f.round_name||"Fight Card")}</h3><span class="pill ${cls}">${esc(f.status)}</span></div>
      <div class="row"><b>${esc(a)}</b><span class="vs">VS</span><b>${esc(b)}</b></div>
      <div class="muted">${esc(f.rule_set||"No rules set")}</div>
      <span class="pill">Fight ID ${f.id}</span><span class="pill">A odds ${f.odds_a}</span><span class="pill">B odds ${f.odds_b}</span>${checklistSummary(f.id)}${proofSummary(f.id)}
      ${f.starts_at ? `<span class="pill">${esc(f.starts_at)}</span>` : ""}
      ${f.tournament_id ? `<span class="pill">Tournament ${esc(f.tournament_id)}</span>` : ""}
      ${f.spectate_url ? `<div style="margin-top:8px"><button class="blue" onclick="openSpectateMenu(${f.id})">👀 Spectate</button></div>` : ""}
      ${f.winner_fighter_id ? `<div><span class="pill good">Winner ${esc(fighterName(f.winner_fighter_id))} • ${esc(f.result_method)}</span></div>` : ""}
      ${pick && ["live","scheduled"].includes(f.status) ? (
        mine ? `<div><span class="pill good">You picked ${esc(fighterName(mine.pick_fighter_id))} for ${mine.points} pts</span></div>` :
        STATE.user ? `<div class="row"><input id="pts-${f.id}" type="number" min="1" max="100" value="10" style="max-width:120px"><button class="green" onclick="makePick(${f.id},${f.fighter_a_id})">Pick ${esc(a)}</button><button class="green" onclick="makePick(${f.id},${f.fighter_b_id})">Pick ${esc(b)}</button></div>` :
        `<button class="blue" onclick="setTab('settings')">Login to Pick</button>`
      ) : ""}
    </div>
  `;
}

function overview(){
  const top = [...(STATE.fighters||[])].sort((a,b)=>(b.rank_points||0)-(a.rank_points||0))[0];
  const next = fights("live")[0] || fights("scheduled")[0];
  return `
    <div class="grid wide">
      <div class="card hero">
        <h3>Fight Night Control</h3>
        <p>Real app page. The Torn userscript is only the launcher now.</p>
        <span class="pill good">Prediction points only</span>
        <div class="row" style="margin-top:8px">
          <button class="green" onclick="setTab('fightcard')">Fight Card</button>
          <button class="blue" onclick="setTab('fighters')">Fighters</button><button class="blue" onclick="setTab('myfighter')">My Fighter</button>
          <button class="gold" onclick="setTab('picks')">Picks</button><button class="blue" onclick="setTab('announcements')">Posts</button>
          ${isAdmin()?`<button class="red" onclick="setTab('admin')">Admin</button>`:""}
        </div>
      </div>
      <div class="card">
        <h3>Numbers</h3>
        <span class="pill live">Live ${fights("live").length}</span>
        <span class="pill warn">Scheduled ${fights("scheduled").length}</span>
        <span class="pill good">Done ${fights("done").length}</span>
        <span class="pill">Fighters ${(STATE.fighters||[]).length}</span>
        <span class="pill">Belts ${(STATE.belts||[]).length}</span>
        <span class="pill">Teams ${(STATE.teams||[]).length}</span>
      </div>
      <div class="card">
        <h3>Top Fighter</h3>
        ${top ? `<b>${esc(top.nickname||top.name)}</b><br><span class="pill">Rank ${top.rank_points}</span><span class="pill">Record ${top.record_w}-${top.record_l}</span>` : `<div class="empty">No fighters yet.</div>`}
      </div>
    </div>
    <div class="card" style="margin-top:10px"><h3>Latest Alerts</h3>${alertsHtml()}</div>
    <div class="card" style="margin-top:10px">
      <h3>Next Fight</h3>
      ${next ? fightCard(next,false) : `<div class="empty">No live or scheduled fight yet.</div>`}
    </div>
  `;
}

function fightcard(){
  return `<div class="card hero"><h3>Fight Card</h3><button onclick="refresh()">Refresh</button></div><div class="grid wide" style="margin-top:10px">${(STATE.fights||[]).map(f=>fightCard(f,false)).join("") || `<div class="empty">No fights yet.</div>`}</div>`;
}

function privateStats(){
  const raw = localStorage.getItem("tfc_private_battle_stats");
  if(!raw) return `<div class="empty">Login with an API key that allows battle stats.</div><div class="muted">Only visible on your device.</div>`;
  let s; try{s=JSON.parse(raw);}catch(e){return `<div class="empty">Saved stats unreadable. Login again.</div>`;}
  const f = n => Number(n||0).toLocaleString();
  return `<div class="grid"><div class="mini">STR <b>${f(s.strength)}</b></div><div class="mini">DEF <b>${f(s.defense)}</b></div><div class="mini">SPD <b>${f(s.speed)}</b></div><div class="mini">DEX <b>${f(s.dexterity)}</b></div><div class="mini">TOTAL <b>${f(s.total)}</b></div></div>`;
}

function fighters(){
  return `
    <div class="grid wide">
      <div class="card hero"><h3>Fighters</h3><span class="pill">Total ${(STATE.fighters||[]).length}</span></div>
      <div class="card"><h3>Register</h3>${STATE.user ? `<select id="regEvent">${eventOptions()}</select><input id="nick" placeholder="Nickname"><input id="range" placeholder="Stats class"><input id="loadout" placeholder="Funny loadout"><button class="green" onclick="registerFighter()">Register</button>` : `<div class="empty">Login first.</div>`}</div>
      <div class="card private"><h3>Private Battle Stats</h3>${privateStats()}</div>
    </div>
    <div class="grid wide" style="margin-top:10px">
      ${(STATE.fighters||[]).map((f,i)=>`<div class="card"><h3><span class="rank">#${i+1}</span>${esc(f.nickname||f.name)}</h3><div>${esc(f.name)} [${f.torn_id}]</div><div class="muted">${esc(f.stats_range||"No range")}</div><div>${esc(f.loadout||"No loadout")}</div><span class="pill">Record ${f.record_w}-${f.record_l}</span><span class="pill">Rank ${f.rank_points}</span></div>`).join("") || `<div class="empty">No fighters yet.</div>`}
    </div>
  `;
}



function alertsHtml(){
  const alerts = STATE.alerts || [];
  if(!alerts.length) return `<div class="empty">No alerts yet.</div>`;
  return alerts.slice(0,6).map(a=>`<div class="mini"><b>${esc(a.title)}</b><span class="pill">${esc(a.alert_type||"info")}</span><div>${esc(a.body||"")}</div><div class="muted">${esc(a.created_at||"")}</div></div>`).join("");
}
function fightsForTournament(tid){
  return (STATE.fights||[]).filter(f=>Number(f.tournament_id)===Number(tid));
}
function bracketView(t){
  const fs = fightsForTournament(t.id);
  if(!fs.length) return `<div class="empty">No generated fights yet.</div>`;
  const groups = {};
  fs.forEach(f=>{
    const name = String(f.round_name||"Round").replace(/ Match \d+$/,"");
    if(!groups[name]) groups[name]=[];
    groups[name].push(f);
  });
  return Object.keys(groups).map(round=>`
    <div class="bracket-round"><b>${esc(round)}</b>
      ${groups[round].map(f=>`<div class="bracket-fight">${esc(f.fighter_a_nick||f.fighter_a_name||"A")} vs ${esc(f.fighter_b_nick||f.fighter_b_name||"B")} <span class="pill ${f.status==="done"?"good":f.status==="live"?"live":"warn"}">${esc(f.status)}</span>${f.winner_fighter_id?`<div class="muted">Winner: ${esc(fighterName(f.winner_fighter_id))}</div>`:""}</div>`).join("")}
    </div>`).join("");
}
function spectateMenuHtml(fightId){
  const f = (STATE.fights||[]).find(x=>Number(x.id)===Number(fightId));
  if(!f) return `<div class="empty">Fight not found.</div>`;
  const proofs = proofsForFight(fightId);
  return `
    <div class="mini"><b>${esc(f.fighter_a_nick||f.fighter_a_name||"A")} vs ${esc(f.fighter_b_nick||f.fighter_b_name||"B")}</b><br><span class="muted">${esc(f.round_name||"Fight")}</span></div>
    ${f.spectate_url ? `<button class="blue" onclick="window.open('${esc(f.spectate_url)}','_blank','noopener,noreferrer')">Open Spectate Link</button>` : `<div class="empty">No main spectate link set.</div>`}
    <h3 style="margin-top:10px">Proof / Report Links</h3>
    ${proofs.length ? proofs.map(p=>`<div class="mini"><b>${esc(p.title||p.proof_type||"Proof")}</b><span class="pill">${esc(p.proof_type||"note")}</span>${p.url?`<br><button class="blue" onclick="window.open('${esc(p.url)}','_blank','noopener,noreferrer')">Open Link</button>`:""}${p.notes?`<div class="muted">${esc(p.notes)}</div>`:""}</div>`).join("") : `<div class="empty">No proof links yet.</div>`}
  `;
}
function openSpectateMenu(fightId){
  $("spectateModalBody").innerHTML = spectateMenuHtml(fightId);
  $("spectateModal").style.display = "flex";
}
function closeSpectateMenu(){
  $("spectateModal").style.display = "none";
}

function myProfiles(){
  if(!STATE.user) return [];
  return (STATE.fighters||[]).filter(f=>Number(f.torn_id)===Number(STATE.user.torn_id));
}

function fightsForFighter(fid, statuses=null){
  const list = (STATE.fights||[]).filter(f=>Number(f.fighter_a_id)===Number(fid) || Number(f.fighter_b_id)===Number(fid));
  if(!statuses) return list;
  return list.filter(f=>statuses.includes(f.status));
}

function myPickRows(){
  return (STATE.my_predictions||[]).map(p=>{
    const fight = (STATE.fights||[]).find(f=>Number(f.id)===Number(p.fight_id));
    return {prediction:p, fight};
  });
}

function myfighter(){
  if(!STATE.user){
    return `<div class="card hero"><h3>My Fighter Dashboard</h3><div class="empty">Login in Settings first.</div><button class="blue" onclick="setTab('settings')">Go to Settings</button></div>`;
  }

  const mine = myProfiles();
  const profile = mine[0] || null;
  const allMyFights = profile ? fightsForFighter(profile.id) : [];
  const upcoming = profile ? fightsForFighter(profile.id, ["scheduled","live"]) : [];
  const completed = profile ? fightsForFighter(profile.id, ["done"]) : [];
  const pickRows = myPickRows();

  return `
    <div class="grid wide">
      <div class="card hero">
        <h3>👤 My Fighter Dashboard</h3>
        <p class="muted">Your profile, fights, picks, rank, and private stats in one place.</p>
        <span class="pill">Logged in as ${esc(STATE.user.name)} [${STATE.user.torn_id}]</span>
        <span class="pill">Prediction points ${STATE.user.prediction_points}</span>
      </div>

      <div class="card private">

function copyAnnouncement(){
  const box = $("announceOutput");
  if(!box){toast("Nothing to copy.");return;}
  box.focus();

    toast("Announcement copied.");
  }
}

function updateAnnouncement(){
  const type = $("announceType").value;
  let text = "";
  if(type === "fight"){
    const f = (STATE.fights||[]).find(x=>Number(x.id)===Number($("announceFight").value));
    text = fightAnnouncementText(f);
  } else if(type === "winner"){
    const f = (STATE.fights||[]).find(x=>Number(x.id)===Number($("announceFight").value));
    text = winnerAnnouncementText(f);
  } else if(type === "tournament"){
    const t = (STATE.tournaments||[]).find(x=>Number(x.id)===Number($("announceTournament").value));
    text = tournamentAnnouncementText(t);
  } else if(type === "belt"){
    const b = (STATE.belts||[]).find(x=>Number(x.id)===Number($("announceBelt").value));
    text = beltAnnouncementText(b);
  } else {
    text = recruitmentAnnouncementText();
  }
  $("announceOutput").value = text;
}

      <div class="card"><h3>Save Result</h3><select id="resFight">${fightOptions()}</select><select id="resWinner">${fighterOptions("Winner")}</select><input id="resMethod" placeholder="KO / Lowest HP / Surrender"><button class="red" onclick="saveResult()">Save</button></div>
    </div>

    <div class="section-title">Fighters</div>
    <div class="admin-grid">
      <div class="card"><h3>Edit / Remove Fighter</h3><select id="editFighter">${fighterOptions("Choose fighter")}</select><input id="editNick" placeholder="Nickname"><input id="editRange" placeholder="Stats range"><input id="editLoadout" placeholder="Loadout"><input id="editRank" type="number" placeholder="Rank points"><input id="editW" type="number" placeholder="Wins"><input id="editL" type="number" placeholder="Losses"><button class="gold" onclick="updateFighter()">Save Fighter</button><button class="red" onclick="deleteFighter()">Remove Fighter</button></div>
    </div>

    <div class="section-title">Belts</div>
    <div class="admin-grid">
      <div class="card belt"><h3>Edit / Delete Belt</h3><select id="editBelt">${beltOptions()}</select><input id="editBeltName" placeholder="Belt name"><input id="editBeltDivision" placeholder="Division"><select id="editBeltHolder">${fighterOptions("Holder / vacant")}</select><select id="editBeltStatus"><option value="">Leave status</option><option value="active">Active</option><option value="retired">Retired</option><option value="vacant">Vacant</option></select><button class="gold" onclick="updateBelt()">Save Belt</button><button class="red" onclick="deleteBelt()">Delete Belt</button></div>
    </div>

    <div class="section-title">Teams</div>
    <div class="admin-grid">
      <div class="card team"><h3>Edit / Delete Team</h3><select id="editTeam">${teamOptions()}</select><input id="editTeamName" placeholder="Team name"><input id="editTeamCaptain" placeholder="Captain Torn ID"><input id="editTeamMembers" placeholder="Members comma separated"><input id="editTeamNotes" placeholder="Notes"><button class="gold" onclick="updateTeam()">Save Team</button><button class="red" onclick="deleteTeam()">Delete Team</button></div>
    </div>

    <div class="section-title">Refs</div>
    <div class="admin-grid">
      <div class="card ref"><h3>Edit / Delete Ref</h3><select id="editRef">${refOptions()}</select><input id="editRefName" placeholder="Ref name"><input id="editRefTorn" placeholder="Torn ID"><select id="editRefStatus"><option value="">Leave status</option><option value="active">Active</option><option value="inactive">Inactive</option></select><input id="editRefNotes" placeholder="Notes"><button class="gold" onclick="updateRef()">Save Ref</button><button class="red" onclick="deleteRef()">Delete Ref</button></div>
    </div>

    <div class="section-title">Alerts / Notifications</div>
    <div class="admin-grid">
      <div class="card"><h3>Create Alert</h3><input id="alertTitle" placeholder="Alert title"><input id="alertBody" placeholder="Alert body"><select id="alertType"><option value="info">Info</option><option value="fight">Fight</option><option value="tournament">Tournament</option><option value="result">Result</option></select><button class="green" onclick="createAlert()">Create Alert</button></div>
    </div>

    <div class="section-title">Fun Point Adjustments</div>
    <div class="admin-grid">
      <div class="card"><h3>Adjust Points</h3><input id="pointsUser" placeholder="User Torn ID"><input id="pointsAmount" type="number" placeholder="+/- amount"><input id="pointsReason" placeholder="Reason"><button class="green" onclick="adjustPoints()">Adjust Points</button></div>
    </div>
  `;
}

async function login(){
  try{
    const r = await api("/api/login","POST",{api_key:$("apiKey").value.trim()});
    TOKEN = r.token;
    localStorage.setItem("tfc_token", TOKEN);
    if(r.private_battle_stats) localStorage.setItem("tfc_private_battle_stats", JSON.stringify(r.private_battle_stats));
    toast("Logged in.");
    await refresh();
  }catch(e){toast(e.message);}
}
async function logout(){TOKEN="";localStorage.removeItem("tfc_token");localStorage.removeItem("tfc_private_battle_stats");await refresh();}
async function action(path, body, msg){try{await api(path,"POST",body);toast(msg);await refresh();}catch(e){toast(e.message);}}

function convertChallenge(id){
  const eventId = prompt("Event ID for this fight:", (STATE.events[0]&&STATE.events[0].id)||1);
  if(!eventId) return;
  const round = prompt("Round name:", "Challenge Fight") || "Challenge Fight";
  const rules = prompt("Rules:", "Challenge match chaos rules") || "Challenge match chaos rules";
  action("/api/admin/challenges/"+id+"/convert",{
    event_id:eventId,
    round_name:round,
    rule_set:rules,
    starts_at:"",
    spectate_url:""
  },"Challenge converted into fight.");
}
