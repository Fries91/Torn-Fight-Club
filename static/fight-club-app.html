<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Torn Fight Club</title>
<style>
body{margin:0;background:#070707;color:#f4f4f4;font-family:Arial,Helvetica,sans-serif}
header{position:sticky;top:0;z-index:10;background:linear-gradient(90deg,#260000,#111);border-bottom:1px solid #8b0000;box-shadow:0 8px 24px #0008}
.head{max-width:1180px;margin:auto;padding:12px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.logo{font-size:22px;font-weight:900;text-shadow:0 0 12px #d00}
.status{font-size:12px;color:#aaa;text-align:right}
.tabs{max-width:1180px;margin:auto;padding:0 12px 12px;display:flex;gap:6px;flex-wrap:wrap}
button,.tab{border:1px solid #666;background:#222;color:#fff;border-radius:10px;padding:9px 11px;font-weight:900;cursor:pointer}
button:active{transform:scale(.98)}
.tab{border-radius:999px}.tab.active{background:#b40000;border-color:#ff5555}
main{max-width:1180px;margin:auto;padding:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:10px}
.wide{grid-template-columns:repeat(auto-fit,minmax(330px,1fr))}
.admin-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:10px}
.card{background:#141414;border:1px solid #333;border-radius:16px;padding:12px;box-shadow:0 12px 32px #0008}
.hero{background:linear-gradient(135deg,#2b0000,#141414);border-color:#a10000}
.private{background:linear-gradient(135deg,#111827,#0b0b0b);border-color:#60a5fa}
.belt{background:linear-gradient(135deg,#3a2600,#111);border-color:#c79a22}
.ref{background:linear-gradient(135deg,#081b2f,#111);border-color:#3aa5ff}
.team{background:linear-gradient(135deg,#10220f,#111);border-color:#22c55e}
h3{margin:0 0 8px;color:#ff4b4b}.muted{color:#aaa;font-size:12px}
.pill{display:inline-block;border:1px solid #555;background:#222;border-radius:999px;padding:4px 8px;margin:2px;font-size:12px}
.good{border-color:#22c55e;background:#052e16;color:#bbf7d0}.warn{border-color:#f59e0b;background:#332500;color:#fde68a}.live{border-color:#ef4444;background:#3b0505;color:#fecaca}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.between{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
input,select,textarea{width:100%;background:#080808;color:#fff;border:1px solid #555;border-radius:10px;padding:10px;margin:4px 0;box-sizing:border-box}
textarea{min-height:90px}.green{background:#064b20;border-color:#20c060}.red{background:#8b0000;border-color:#ff3333}.gold{background:#5c4000;border-color:#ffc107}.blue{background:#07365c;border-color:#3aa5ff}
.mini{background:#0c0c0c;border:1px solid #2a2a2a;border-radius:10px;padding:8px;margin:6px 0}
.empty{border:1px dashed #555;border-radius:12px;color:#aaa;text-align:center;padding:14px}
.vs{font-size:22px;font-weight:900;color:#ff4b4b}.rank{font-size:22px;color:#ff4b4b;font-weight:900}
.ufc-card{background:radial-gradient(circle at top,#3b0000,#101010 52%,#070707);border:1px solid #7f1d1d;border-radius:18px;overflow:hidden;box-shadow:0 16px 40px #000b;margin:10px 0}
.ufc-head{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;background:linear-gradient(90deg,#111,#260000,#111);border-bottom:1px solid #7f1d1d}
.ufc-title{font-size:13px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:#fef2f2}
.ufc-body{padding:12px}
.ufc-match{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.ufc-fighter{background:linear-gradient(135deg,#181818,#080808);border:1px solid #333;border-radius:16px;padding:12px;min-height:98px;display:flex;flex-direction:column;justify-content:center}
.ufc-fighter.left{text-align:left}.ufc-fighter.right{text-align:right}
.ufc-name{font-size:20px;font-weight:1000;color:#fff;text-shadow:0 0 10px #000;line-height:1.1}
.ufc-sub{color:#aaa;font-size:12px;margin-top:5px}
.ufc-vs{display:flex;align-items:center;justify-content:center;width:54px;height:54px;border-radius:50%;border:2px solid #ef4444;background:#150000;color:#fff;font-weight:1000;font-size:18px;box-shadow:0 0 18px #b91c1c99}
.ufc-details{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px;margin-top:12px}
.ufc-detail{background:#0a0a0a;border:1px solid #2a2a2a;border-radius:12px;padding:8px}
.ufc-detail b{color:#ff6969}
.ufc-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.ufc-winner{margin-top:12px;background:linear-gradient(135deg,#3a2600,#111);border:1px solid #c79a22;border-radius:12px;padding:10px;font-weight:900}
.ufc-main-event{border-color:#f59e0b;box-shadow:0 0 20px #b4530988,0 16px 40px #000b}
.ufc-main-event .ufc-head{background:linear-gradient(90deg,#3a2600,#111,#3a0000)}
@media(max-width:650px){.ufc-match{grid-template-columns:1fr}.ufc-vs{margin:auto;width:46px;height:46px}.ufc-fighter.left,.ufc-fighter.right{text-align:center}.ufc-name{font-size:18px}.ufc-body{padding:10px}}
.section-title{margin:14px 0 8px;color:#fff;font-size:16px;border-left:4px solid #b40000;padding-left:8px}
#toast{position:fixed;right:12px;bottom:62px;background:#111;border:1px solid #ff4b4b;border-radius:12px;padding:10px;display:none;z-index:50;max-width:90vw}
.bottom-quick{position:fixed;left:0;right:0;bottom:0;background:#111;border-top:1px solid #8b0000;display:flex;gap:6px;justify-content:center;padding:7px;z-index:40}
.bottom-quick button{font-size:12px;padding:7px 9px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.78);display:none;align-items:center;justify-content:center;z-index:80;padding:12px}
.modal .box{background:#141414;border:1px solid #8b0000;border-radius:16px;padding:12px;max-width:520px;width:100%;box-shadow:0 18px 50px #000}
.bracket-round{border-left:4px solid #b40000;padding-left:8px;margin:10px 0}
.bracket-fight{background:#0c0c0c;border:1px solid #333;border-radius:10px;padding:8px;margin:6px 0}
@media(max-width:650px){.head{display:block}.status{text-align:left;margin-top:5px}.grid,.wide,.admin-grid{grid-template-columns:1fr}main{padding:8px 8px 68px}.tab{font-size:12px;padding:7px 8px}.tabs{max-height:86px;overflow:auto}.card{padding:10px}.section-title{margin-top:10px}}
</style>
</head>
<body>
<header>
  <div class="head">
    <div class="logo">🥊🔥 THE TORN FIGHT CLUB</div>
    <div class="status" id="userStatus">Starting...</div>
  </div>
  <nav class="tabs" id="tabs"></nav>
</header>

<main id="app">
  <div class="card hero">
    <h3>Loading Fight Club...</h3>
    <p class="muted">Connecting to backend...</p>
  </div>
</main>

<div id="toast"></div>
<div class="bottom-quick"><button onclick="setTab('overview')">Home</button><button onclick="setTab('notifications')">🔔</button><button onclick="setTab('fightcard')">Fights</button><button onclick="setTab('myfighter')">Mine</button></div>
<div class="modal" id="spectateModal"><div class="box"><h3>👀 Spectate / Proof Menu</h3><div id="spectateModalBody"></div><button onclick="closeSpectateMenu()">Close</button></div></div>

<script>

window.addEventListener('error', function(e){
  try{
    const appBox = $("app");
    if(appBox && appBox.textContent.includes("Loading Fight Club")){
      appBox.innerHTML = `<div class="card hero"><h3>App Script Error</h3><p>${esc(e.message || "Unknown error")}</p><p class="muted">Replace the latest fixed fight-club-app.html and redeploy.</p></div>`;
    }
  }catch(x){}
});
window.addEventListener('unhandledrejection', function(e){
  try{
    const msg = e.reason && (e.reason.message || String(e.reason)) || "Unknown promise error";
    const appBox = $("app");
    if(appBox && appBox.textContent.includes("Loading Fight Club")){
      appBox.innerHTML = `<div class="card hero"><h3>App Loading Error</h3><p>${esc(msg)}</p><p class="muted">Backend or app script failed during load.</p><button onclick="refresh()">Retry</button></div>`;
    }
  }catch(x){}
});

const BASE = "https://torn-fight-club.onrender.com";
let TOKEN = localStorage.getItem("tfc_token") || "";
let TAB = localStorage.getItem("tfc_tab") || "overview";
let STATE = {
  ok: true, user: null, events: [], fighters: [], fights: [], ideas: [], leaderboard: [],
  my_predictions: [], tournaments: [], tournament_entries: [], belts: [], teams: [], referees: [], audit: [], ref_checklists: [], fight_proofs: [], fight_logs: [], fight_props: [], my_prop_wagers: [], challenges: [], alerts: [], fight_logs: [], point_settings:{item_name:'Xanax',item_amount:1,points_amount:100,pay_to_name:'Slimyfleshlite',pay_to_torn_id:1905671}, point_orders:[], reward_slots:[], reward_requests:[], matchmaking_settings:{range_amount:5000000}, match_queue:[], matchmaking_matches:[], matchmaking_settings:{range_amount:5000000}, match_queue:[], matchmaking_matches:[], reward_slots:[], reward_requests:[], matchmaking_settings:{range_amount:5000000}, match_queue:[], matchmaking_matches:[], matchmaking_settings:{range_amount:5000000}, match_queue:[], matchmaking_matches:[], my_notifications: [], fight_props: [], my_prop_wagers: [], idea_votes: []
};

const ADMINS = [3679030, 1905671];

function $(id){return document.getElementById(id);}
function esc(s){return String(s ?? "").replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function toast(msg){const t=$("toast");t.textContent=msg;t.style.display="block";setTimeout(()=>t.style.display="none",3500);}
function isAdmin(){return STATE.user && ADMINS.includes(Number(STATE.user.torn_id));}
function userLine(){return STATE.user ? `${esc(STATE.user.name)} [${STATE.user.torn_id}] • ${esc(STATE.user.role)} • ${STATE.user.prediction_points} pts` : "Not logged in";}
function setTab(t){TAB=t;localStorage.setItem("tfc_tab",t);render();}
function fights(status){return (STATE.fights||[]).filter(f=>!status||f.status===status);}
function eventOptions(){return (STATE.events||[]).map(e=>`<option value="${e.id}">${e.id} — ${esc(e.title)}</option>`).join("") || `<option value="1">Default Event</option>`;}
function fighterOptions(label="Choose fighter"){return `<option value="">${esc(label)}</option>` + (STATE.fighters||[]).map(f=>`<option value="${f.id}">${f.id} — ${esc(f.nickname||f.name)} [${f.torn_id}]</option>`).join("");}
function fightOptions(){return `<option value="">Choose fight</option>` + (STATE.fights||[]).map(f=>`<option value="${f.id}">${f.id} — ${esc(f.fighter_a_nick||f.fighter_a_name)} vs ${esc(f.fighter_b_nick||f.fighter_b_name)} — ${esc(f.status)}</option>`).join("");}
function teamOptions(){return `<option value="">Choose team</option>` + (STATE.teams||[]).map(t=>`<option value="${t.id}">${t.id} — ${esc(t.name)}</option>`).join("");}
function refOptions(){return `<option value="">Choose ref</option>` + (STATE.referees||[]).map(r=>`<option value="${r.id}">${r.id} — ${esc(r.name)}</option>`).join("");}
function eventEditOptions(){return `<option value="">Choose event</option>` + (STATE.events||[]).map(e=>`<option value="${e.id}">${e.id} — ${esc(e.title)}</option>`).join("");}
function beltOptions(){return `<option value="">Choose belt</option>` + (STATE.belts||[]).map(b=>`<option value="${b.id}">${b.id} — ${esc(b.name)}</option>`).join("");}
function tournamentOptions(){return `<option value="">Choose tournament</option>` + (STATE.tournaments||[]).map(t=>`<option value="${t.id}">${t.id} — ${esc(t.title)}</option>`).join("");}
function fighterName(id){const f=(STATE.fighters||[]).find(x=>Number(x.id)===Number(id));return f ? (f.nickname||f.name) : "Fighter "+id;}

async function api(path, method="GET", body=null){
  const controller = new AbortController();
  const timer = setTimeout(()=>controller.abort(), 15000);
  try{
    const res = await fetch(BASE + path, {
      method,
      signal: controller.signal,
      headers: {"Content-Type":"application/json", ...(TOKEN ? {"Authorization":"Bearer "+TOKEN} : {})},
      body: body ? JSON.stringify(body) : null
    });
    const text = await res.text();
    let data = {};
    try{data = JSON.parse(text || "{}");}
    catch(e){throw new Error("Backend returned bad JSON.");}
    if(!res.ok || data.ok === false) throw new Error(data.error || "Backend request failed.");
    return data;
  }finally{clearTimeout(timer);}
}


function normalizeState(data){
  data = data || {};
  const defaults = {
    ok:true, user:null, events:[], fighters:[], fights:[], ideas:[], leaderboard:[],
    my_predictions:[], my_notifications:[], tournaments:[], tournament_entries:[],
    belts:[], teams:[], referees:[], audit:[], ref_checklists:[], fight_proofs:[], fight_logs:[],
    challenges:[], alerts:[], fight_logs:[], point_settings:{item_name:'Xanax',item_amount:1,points_amount:100,pay_to_name:'Slimyfleshlite',pay_to_torn_id:1905671}, point_orders:[], reward_slots:[], reward_requests:[], matchmaking_settings:{range_amount:5000000}, match_queue:[], matchmaking_matches:[]
  };
  return Object.assign(defaults, data);
}

async function refresh(){
  $("userStatus").textContent = "Refreshing...";
  try{
    STATE = normalizeState(await api("/api/state"));
    render();
  }catch(e){
    $("userStatus").textContent = "Offline";
    $("app").innerHTML = `<div class="card hero"><h3>Connection Error</h3><p>${esc(e.message || e)}</p><p class="muted">Open /api/state on Render to check backend. If it says server error, replace app.py too.</p><button onclick="refresh()">Retry</button></div>`;
  }
}

function renderTabs(){
  let tabs = ["overview","notifications","fightcard","fightLogs","fighters","myfighter","matchmaking","challenges","points","exchange","picks","leaderboard","belts","ideas","rules","settings"];
  if(isAdmin()){ tabs.push("announcements"); tabs.push("admin"); }
  const adminOnlyTabs = ["admin","announcements"];
  if(!isAdmin()) tabs = tabs.filter(t=>!adminOnlyTabs.includes(t));
  const labels = {overview:"Overview",notifications:"🔔",fightcard:"Fight Card",fightLogs:"Fight Logs",fighters:"Fighters",myfighter:"My Fighter",matchmaking:"Matchmaking",challenges:"Challenges",points:"Points",exchange:"Exchange",picks:"Picks",leaderboard:"Ranks",belts:"Belts",announcements:"Posts",ideas:"Ideas",rules:"Rules",settings:"Settings",admin:"Admin"};
  $("tabs").innerHTML = tabs.map(t=>`<button class="tab ${TAB===t?"active":""}" onclick="setTab('${t}')">${labels[t]}</button>`).join("");
}

function applyAdminOnlyUi(){
  document.querySelectorAll('.admin-only-posts-btn').forEach(el=>{
    el.style.display = isAdmin() ? '' : 'none';
  });
}

function render(){
  if(!isAdmin() && ["admin","announcements"].includes(TAB)) TAB="overview";
  maybeBrowserNotify();
  $("userStatus").innerHTML = userLine();
  renderTabs();
  const pages = {overview, notifications, fightcard, fightLogs, fighters, myfighter, matchmaking, challenges, points, exchange, picks, leaderboard, belts, ideas, rules, settings, admin};
  if(typeof announcements === "function") pages.announcements = announcements;
  $("app").innerHTML = (pages[TAB] || overview)();
  applyAdminOnlyUi();
}


function checklistForFight(fightId){
  return (STATE.ref_checklists||[]).find(c=>Number(c.fight_id)===Number(fightId)) || {};
}
function checklistSummary(fightId){
  const c = checklistForFight(fightId);
  const checks = ["both_showed","rules_confirmed","fight_started","winner_confirmed","method_confirmed"];
  const done = checks.filter(k=>Number(c[k]||0)===1).length;
  const cls = done===5 ? "good" : done>0 ? "warn" : "";
  return `<span class="pill ${cls}">Ref checklist ${done}/5</span>`;
}
function checkbox(name, label, checked){
  return `<label class="mini"><input type="checkbox" id="${name}" ${checked ? "checked" : ""} style="width:auto;margin-right:6px">${label}</label>`;
}


function proofsForFight(fightId){
  return (STATE.fight_proofs||[]).filter(p=>Number(p.fight_id)===Number(fightId));
}
function proofSummary(fightId){
  const n = proofsForFight(fightId).length;
  return `<span class="pill ${n ? "good" : ""}">Proofs ${n}</span>`;
}
function proofListHtml(fightId, adminControls=false){
  const proofs = proofsForFight(fightId);
  if(!proofs.length) return `<div class="empty">No proof links or notes saved yet.</div>`;
  return proofs.map(p=>`
    <div class="mini">
      <b>${esc(p.title || p.proof_type || "Proof")}</b>
      <span class="pill">${esc(p.proof_type || "note")}</span>
      ${p.url ? `<br><button class="blue" onclick="openSpectate('${encodeURIComponent(String(p.url||""))}')">Open Link</button>` : ""}
      ${p.notes ? `<div class="muted">${esc(p.notes)}</div>` : ""}
      <div class="muted">Proof ID ${p.id} • ${esc(p.created_at||"")}</div>
      ${adminControls ? `<button class="red" onclick="deleteProof(${p.id})">Delete Proof</button>` : ""}
    </div>
  `).join("");
}


function notifications(){
  return `
    <div class="card hero">
      <h3>🔔 My Notifications</h3>
      <p class="muted">Challenge approvals and scheduled fights show here. Browser notifications work while this app page is open.</p>
      ${notificationPill()}
      <div class="row" style="margin-top:8px">
        <button class="green" onclick="requestBrowserNotifications()">Enable Browser Popups</button>
        <button onclick="markAllNotificationsRead()">Mark All Read</button><button class="red" onclick="clearReadNotifications()">Clear Read</button>
      </div>
    </div>
    <div class="grid wide" style="margin-top:10px">
      <div class="card"><h3>Notification Inbox</h3>${notificationList()}</div>
    </div>
  `;
}


function propsForFight(fightId){
  return (STATE.fight_props||[]).filter(p=>Number(p.fight_id)===Number(fightId));
}
function myPropWager(propId){
  return (STATE.my_prop_wagers||[]).find(w=>Number(w.prop_id)===Number(propId));
}
function propWagerBox(prop){
  const mine = myPropWager(prop.id);
  const closed = prop.status !== "open";
  const options = [
    ["A", prop.option_a || "Option 1"],
    ["B", prop.option_b || "Option 2"],
    ["C", prop.option_c || ""],
    ["D", prop.option_d || ""]
  ].filter(x=>String(x[1]||"").trim());
  const pickedLabel = mine ? (options.find(x=>x[0]===mine.pick_option)||[])[1] : "";
  const wonText = prop.winning_option === "void" ? "Voided" : ((options.find(x=>x[0]===prop.winning_option)||[])[1] || "");
  return `<div class="mini">
    <b>🎲 ${esc(prop.title)}</b>
    <span class="pill ${closed ? "good" : "warn"}">${esc(prop.status||"open")}</span>
    ${wonText ? `<span class="pill good">Result: ${esc(wonText)}</span>` : ""}
    ${mine ? `<div class="muted">Your wager: ${esc(pickedLabel)} for ${esc(mine.points)} pts • ${esc(mine.status||"open")}</div>` : ""}
    ${!closed && STATE.user ? `
      <div class="row">
        <input id="propPts-${prop.id}" type="number" min="1" value="${mine ? esc(mine.points) : 5}" style="max-width:110px" placeholder="Points">
        ${options.map(o=>`<button class="green" onclick="placePropWager(${prop.id},'${o[0]}')">${esc(o[1])}</button>`).join("")}
      </div>
    ` : !STATE.user ? `<button class="blue" onclick="setTab('settings')">Login to wager</button>` : ""}
    ${isAdmin() && !closed ? `<div class="row">${options.map(o=>`<button class="gold" onclick="resolveProp(${prop.id},'${o[0]}')">Result: ${esc(o[1])}</button>`).join("")}<button onclick="resolveProp(${prop.id},'void')">Void</button><button class="red" onclick="deleteProp(${prop.id})">Delete</button></div>` : ""}
  </div>`;
}

function propsForFightHtml(fightId){
  const props = propsForFight(fightId);
  if(!props.length) return `<div class="empty">No silly side wagers for this fight yet.</div>`;
  return props.map(propWagerBox).join("");
}

function fightCard(f, pick=false){
  const a = f.fighter_a_nick || f.fighter_a_name || "Fighter A";
  const b = f.fighter_b_nick || f.fighter_b_name || "Fighter B";
  const mine = (STATE.my_predictions||[]).find(p=>Number(p.fight_id)===Number(f.id));
  const cls = f.status==="live" ? "live" : f.status==="done" ? "good" : "warn";
  return `
    <div class="card">
      <div class="between"><h3>${esc(f.round_name||"Fight Card")}</h3><span class="pill ${cls}">${esc(f.status)}</span></div>
      <div class="row"><b>${esc(a)}</b><span class="vs">VS</span><b>${esc(b)}</b></div>
      <div class="muted">${esc(f.rule_set||"No rules set")}</div>
      <span class="pill">Fight ID ${f.id}</span><span class="pill">A odds ${f.odds_a}</span><span class="pill">B odds ${f.odds_b}</span>${checklistSummary(f.id)}${proofSummary(f.id)}
      ${f.starts_at ? `<span class="pill">${esc(f.starts_at)}</span>` : ""}
      ${f.tournament_id ? `<span class="pill">Tournament ${esc(f.tournament_id)}</span>` : ""}
      ${f.spectate_url ? `<div style="margin-top:8px"><button class="blue" onclick="openSpectateMenu(${f.id})">👀 Spectate</button></div>` : ""}
      ${f.winner_fighter_id ? `<div><span class="pill good">Winner ${esc(fighterName(f.winner_fighter_id))} • ${esc(f.result_method)}</span></div>` : ""}
      ${pick && ["live","scheduled"].includes(f.status) ? (
        mine ? `<div><span class="pill good">You picked ${esc(fighterName(mine.pick_fighter_id))} for ${mine.points} pts</span></div>` :
        STATE.user ? `<div class="row"><input id="pts-${f.id}" type="number" min="1" max="100" value="10" style="max-width:120px"><button class="green" onclick="makePick(${f.id},${f.fighter_a_id})">Pick ${esc(a)}</button><button class="green" onclick="makePick(${f.id},${f.fighter_b_id})">Pick ${esc(b)}</button></div>` :
        `<button class="blue" onclick="setTab('settings')">Login to Pick</button>`
      ) : ""}
    </div>
  `;
}

function overview(){
  const top = [...(STATE.fighters||[])].sort((a,b)=>(b.rank_points||0)-(a.rank_points||0))[0];
  const next = fights("live")[0] || fights("scheduled")[0];
  return `
    <div class="grid wide">
      <div class="card hero">
        <h3>Fight Night Control</h3>
        <p>Real app page. The Torn userscript is only the launcher now.</p>
        <span class="pill good">Prediction points only</span>
        <div class="row" style="margin-top:8px">
          <button class="green" onclick="setTab('fightcard')">Fight Card</button>

function fightStatusClass(status){
  return status==="live" ? "live" : status==="done" ? "good" : status==="cancelled" ? "" : "warn";
}

function ufcFightCard(f, index=0){
  const a = f.fighter_a_nick || f.fighter_a_name || "Fighter A";
  const b = f.fighter_b_nick || f.fighter_b_name || "Fighter B";
  const main = index === 0 ? "ufc-main-event" : "";
  const title = index === 0 ? "MAIN EVENT" : `BOUT ${index + 1}`;
  const statusCls = fightStatusClass(f.status);
  const props = typeof propsForFight === "function" ? propsForFight(f.id).length : 0;
  const proofs = typeof proofsForFight === "function" ? proofsForFight(f.id).length : 0;
  const checklist = typeof checklistForFight === "function" ? checklistForFight(f.id) : {};
  const checkDone = ["both_showed","rules_confirmed","fight_started","winner_confirmed","method_confirmed"].filter(k=>Number(checklist[k]||0)===1).length;

  return `
    <div class="ufc-card ${main}">
      <div class="ufc-head">
        <div class="ufc-title">🥊 TORN FIGHT CLUB — ${title}</div>
        <span class="pill ${statusCls}">${esc(f.status || "scheduled")}</span>
      </div>
      <div class="ufc-body">
        <div class="ufc-match">
          <div class="ufc-fighter left">
            <div class="ufc-name">${esc(a)}</div>
            <div class="ufc-sub">Fighter A ${f.fighter_a_id ? "• ID " + esc(f.fighter_a_id) : ""}</div>
          </div>
          <div class="ufc-vs">VS</div>
          <div class="ufc-fighter right">
            <div class="ufc-name">${esc(b)}</div>
            <div class="ufc-sub">Fighter B ${f.fighter_b_id ? "• ID " + esc(f.fighter_b_id) : ""}</div>
          </div>
        </div>

        <div class="ufc-details">
          <div class="ufc-detail"><b>Match</b><br>${esc(f.round_name || "Fight Card")}</div>
          <div class="ufc-detail"><b>Rules</b><br>${esc(f.rule_set || "Chaos rules")}</div>
          <div class="ufc-detail"><b>Start</b><br>${esc(f.starts_at || "TBA")}</div>
          <div class="ufc-detail"><b>Odds</b><br>${esc(f.odds_a || "1.9")} / ${esc(f.odds_b || "1.9")}</div>
        </div>

        <div class="ufc-actions">
          <span class="pill">Fight ID ${esc(f.id)}</span>
          <span class="pill">Side wagers ${props}</span>
          <span class="pill">Proofs ${proofs}</span>
          <span class="pill">Ref ${checkDone}/5</span>
          ${f.spectate_url || proofs ? `<button class="blue" onclick="openSpectateMenu(${f.id})">👀 Watch / Proof</button>` : ""}
          <button class="gold" onclick="setTab('picks')">Pick / Wager</button><button class="green" onclick="setTab('fightLogs')">Submit Log</button>
        </div>

        ${f.winner_fighter_id ? `<div class="ufc-winner">👑 Winner: ${esc(fighterName(f.winner_fighter_id))} ${f.result_method ? "• " + esc(f.result_method) : ""}</div>` : ""}

    </div>
  `;
}

let LAST_SEEN_NOTIFICATION_ID = Number(localStorage.getItem("tfc_last_seen_notification_id") || 0);

function unreadNotifications(){
  return (STATE.my_notifications||[]).filter(n=>Number(n.is_read||0)===0);
}

function newestNotificationId(){
  const list = STATE.my_notifications || [];
  return list.length ? Math.max(...list.map(n=>Number(n.id||0))) : 0;
}

function requestBrowserNotifications(){
  if(!("Notification" in window)){
    toast("Browser notifications are not supported here.");
    return;
  }
  Notification.requestPermission().then(p=>{
    toast(p === "granted" ? "Browser notifications enabled." : "Browser notifications not enabled.");
  });
}

function maybeBrowserNotify(){
  if(!("Notification" in window) || Notification.permission !== "granted") return;
  const unread = unreadNotifications();
  if(!unread.length) return;
  const newest = newestNotificationId();
  if(newest <= LAST_SEEN_NOTIFICATION_ID) return;
  const latest = unread[0];
  try{
    new Notification(latest.title || "Fight Club notification", {
      body: latest.body || "",
      tag: "tfc-" + latest.id
    });
  }catch(e){}
  LAST_SEEN_NOTIFICATION_ID = newest;
  localStorage.setItem("tfc_last_seen_notification_id", String(newest));
}

function notificationPill(){
  const n = unreadNotifications().length;
  return n ? `<span class="pill live">🔔 ${n} unread</span>` : `<span class="pill good">No unread notifications</span>`;
}

function notificationList(limit=null){
  let list = STATE.my_notifications || [];
  if(limit) list = list.slice(0, limit);
  if(!STATE.user) return `<div class="empty">Login to see notifications.</div>`;
  if(!list.length) return `<div class="empty">No notifications yet.</div>`;
  return list.map(n=>`
    <div class="mini">
      <b>${esc(n.title)}</b>
      <span class="pill ${Number(n.is_read||0)===0 ? "live" : "good"}">${Number(n.is_read||0)===0 ? "unread" : "read"}</span>
      <span class="pill">${esc(n.notification_type||"info")}</span>
      <div>${esc(n.body||"")}</div>
      ${n.related_fight_id ? `<button class="blue" onclick="setTab('fightcard')">Open Fight Card</button>` : ""}
      <div class="muted">${esc(n.created_at||"")}</div>
      ${Number(n.is_read||0)===0 ? `<button onclick="markNotificationRead(${n.id})">Mark Read</button>` : ""}
    </div>
  `).join("");
}

function bracketView(t){
  const fs = fightsForTournament(t.id);
  if(!fs.length) return `<div class="empty">No generated fights yet.</div>`;
  const groups = {};
  fs.forEach(f=>{

  return Object.keys(groups).map(round=>`
    <div class="bracket-round"><b>${esc(round)}</b>
      ${groups[round].map(f=>`<div class="bracket-fight">${esc(f.fighter_a_nick||f.fighter_a_name||"A")} vs ${esc(f.fighter_b_nick||f.fighter_b_name||"B")} <span class="pill ${f.status==="done"?"good":f.status==="live"?"live":"warn"}">${esc(f.status)}</span>${f.winner_fighter_id?`<div class="muted">Winner: ${esc(fighterName(f.winner_fighter_id))}</div>`:""}</div>`).join("")}

function updateAnnouncementSafe(){
  const out = $("announceOutput");
  if(!out) return;
  const type = $("announceType") ? $("announceType").value : "recruit";
  let text = "";
  if(type === "fight" || type === "winner"){
    const f = (STATE.fights||[]).find(x=>Number(x.id)===Number($("announceFight").value));
    if(!f){
      text = "No fight selected.";
    }else{
      const a = f.fighter_a_nick || f.fighter_a_name || "Fighter A";
      const b = f.fighter_b_nick || f.fighter_b_name || "Fighter B";
      if(type === "winner"){
        text = `@everyone 🏆🥊\n\nTORN FIGHT CLUB RESULT\n\n${a} VS ${b}\n\n👑 Winner: ${f.winner_fighter_id ? fighterName(f.winner_fighter_id) : "Winner not set yet"}\n💀 Result Method: ${f.result_method || "TBA"}\n📋 Match: ${f.round_name || "Fight Card"}\n🎭 Rules: ${f.rule_set || "Chaos rules"}\n\nFirst rule of Fight Club...\nYou ABSOLUTELY talk about Fight Club.`;
      }else{
        text = `@everyone 🥊🔥\n\nTHE TORN FIGHT CLUB\n\nNEXT FIGHT:\n${a} VS ${b}\n\n📋 Match: ${f.round_name || "Fight Card"}\n🎭 Rules: ${f.rule_set || "Chaos rules"}\n⏰ Start: ${f.starts_at || "TBA"}\n\nFirst rule of Fight Club...\nYou ABSOLUTELY talk about Fight Club.`;
      }
    }
  }else if(type === "belt"){
    const b = (STATE.belts||[]).find(x=>Number(x.id)===Number($("announceBelt").value));
    text = b ? `@everyone 👑🥊\n\nTORN FIGHT CLUB BELT\n\n🏆 Belt: ${b.name}\n🎭 Division: ${b.division || "Open"}\n👑 Holder: ${b.holder_fighter_id ? (b.holder_nick || b.holder_name || "Holder") : "Vacant"}\n\nChallenge them. Call them out. Make it chaotic.` : "No belt selected.";
  }else if(type === "tournament"){
    const t = (STATE.tournaments||[]).find(x=>Number(x.id)===Number($("announceTournament").value));
    text = t ? `@everyone 🏆🥊\n\nTORN FIGHT CLUB TOURNAMENT\n\n📛 Tournament: ${t.title}\n🎭 Format: ${t.format || "Chaos bracket"}\n📋 Status: ${t.status || "planned"}\n📝 Notes: ${t.notes || "No notes yet."}` : "No tournament selected.";
  }else{
    text = `@everyone 🥊🔥\n\nWELCOME TO THE TORN FIGHT CLUB\n\nLooking for:\n🥊 Fighters\n⚖️ Referees\n😂 Funny fight ideas\n👀 Spectators\n\nFirst rule of Fight Club...\nYou ABSOLUTELY talk about Fight Club.`;
  }
  out.value = text;
}

function copyAnnouncementSafe(){
  const box = $("announceOutput");
  if(!box){toast("Nothing to copy.");return;}
  box.focus();
  box.select();
  try{
    navigator.clipboard.writeText(box.value);
    toast("Announcement copied.");
  }catch(e){
    document.execCommand("copy");
    toast("Announcement copied.");
  }
}

async function login(){
  try{
    const r = await api("/api/login","POST",{api_key:$("apiKey").value.trim()});
    TOKEN = r.token;
    localStorage.setItem("tfc_token", TOKEN);
    if(r.private_battle_stats) localStorage.setItem("tfc_private_battle_stats", JSON.stringify(r.private_battle_stats));
    toast("Logged in.");
    await refresh();
  }catch(e){toast(e.message);}
}
async function logout(){TOKEN="";localStorage.removeItem("tfc_token");localStorage.removeItem("tfc_private_battle_stats");await refresh();}

function createProp(){
  action("/api/admin/props",{
    fight_id:$("propFight").value,
    title:$("propTitle").value,
    option_a:$("propA").value || "Option 1",
    option_b:$("propB").value || "Option 2",
    option_c:$("propC").value || "",
    option_d:$("propD").value || ""
  },"Silly side wager created.");
}
function placePropWager(propId,opt){
  const pts = $("propPts-"+propId).value;
  action("/api/props/"+propId+"/wager",{
    pick_option:opt,
    points:pts
  },"Side wager saved.");
}
function resolveProp(propId,opt){
  if(!confirm("Resolve this silly wager?")) return;
  action("/api/admin/props/"+propId+"/resolve",{
    winning_option:opt
  },"Side wager resolved.");
}
function deleteProp(propId){
  if(!confirm("Delete this side wager and refund open wagers?")) return;
  action("/api/admin/props/"+propId+"/delete",{},"Side wager deleted.");
}


function requestPoints(){
  action("/api/points/request",{
    item_amount:$("pointItemAmount").value,
    proof:$("pointProof").value
  },"Point request submitted.");
}
function savePointSettings(){
  action("/api/admin/points/settings",{
    item_name:$("setItemName").value,
    item_amount:$("setItemAmount").value,
    points_amount:$("setPointsAmount").value,
    pay_to_name:$("setPayToName").value,
    pay_to_torn_id:$("setPayToId").value
  },"Point rate saved.");
}
function resolvePointOrder(id,status){
  action("/api/admin/points/orders/"+id+"/resolve",{
    status,
    admin_note:$("pointNote-"+id) ? $("pointNote-"+id).value : ""
  },"Point request updated.");
}
function resetAllPoints(){
  if(!confirm("Reset every user's points to 0?")) return;
  action("/api/admin/points/reset-all",{
    confirm:$("resetConfirm").value
  },"All points reset to 0.");
}


function requestReward(slot){
  action("/api/rewards/request",{
    slot,
    note:$("rewardNote-"+slot) ? $("rewardNote-"+slot).value : ""
  },"Reward request submitted.");
}
function resolveRewardRequest(id,status){
  action("/api/admin/rewards/requests/"+id+"/resolve",{
    status,
    admin_note:$("rewardAdminNote-"+id) ? $("rewardAdminNote-"+id).value : ""
  },"Reward request updated.");
}
function saveRewardSlots(){
  const slots = [1,2,3,4,5].map(n=>({
    slot:n,
    item_name:$("rewardName-"+n).value,
    item_amount:$("rewardAmount-"+n).value,
    points_cost:$("rewardCost-"+n).value,
    reward_note:$("rewardNote-"+n).value,
    is_active:$("rewardActive-"+n).checked
  }));
  action("/api/admin/rewards/slots",{slots},"Reward slots saved.");
}


function requestPointsFromExchange(){
  action("/api/points/request",{
    item_amount:$("exchangePointItemAmount").value,
    proof:$("exchangePointProof").value
  },"Point request submitted.");
}


function enterMatchmaking(){action("/api/matchmaking/enter",{fighter_id:$("mmFighter")?$("mmFighter").value:""},"Entered matchmaking queue.");}
function leaveMatchmaking(){action("/api/matchmaking/leave",{},"Left matchmaking queue.");}
function saveMatchmakingSettings(){action("/api/admin/matchmaking/settings",{range_amount:$("mmRange").value},"Match range saved.");}
function setMatchStatus(id,status){action("/api/admin/matchmaking/matches/"+id+"/status",{status,admin_note:$("mmNote-"+id)?$("mmNote-"+id).value:""},"Match updated.");}
function createFightFromMatch(id){action("/api/admin/matchmaking/matches/"+id+"/create-fight",{event_id:$("mmEvent-"+id).value,round_name:$("mmRound-"+id).value,rule_set:$("mmRules-"+id).value,starts_at:$("mmStart-"+id).value,spectate_url:$("mmSpectate-"+id).value},"Fight created from match.");}


function submitFightLog(fightId){
  action("/api/fights/"+fightId+"/log",{
    winner_fighter_id:$("logWinner-"+fightId).value,
    result_method:$("logMethod-"+fightId).value,
    battle_report_url:$("logBattle-"+fightId).value,
    screenshot_url:$("logShot-"+fightId).value,
    notes:$("logNotes-"+fightId).value
  },"Fight log submitted for admin review.");
}
function reviewFightLog(logId,status){
  action("/api/admin/fight-logs/"+logId+"/review",{
    status,
    admin_note:$("fightLogNote-"+logId) ? $("fightLogNote-"+logId).value : "",
    update_fight:$("fightLogUpdate-"+logId) ? $("fightLogUpdate-"+logId).checked : true
  },"Fight log reviewed.");
}


function clearReadNotifications(){
  if(!confirm("Remove all read notifications? Unread notifications will stay.")) return;
  action("/api/notifications/clear-read",{},"Read notifications cleared.");
}

render();
refresh();
</script>
</body>
</html>
