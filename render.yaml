services:
  - type: web
    name: torn-fight-club
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 8 --timeout 120
    envVars:
      - key: DB_PATH
        value: /var/data/torn_fight_club.sqlite3
      - key: TORN_API_BASE
        value: https://api.torn.com
      - key: REQUEST_TIMEOUT
        value: "12"
